<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Git workflow</title>
  <desc id="desc">Working tree moves to staging area, then local repository, then remote repository.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef5b35"/></marker></defs>
  <rect width="900" height="300" fill="#fffdf8"/>
  <path d="M0 42H900" stroke="#e4ddd1"/>
  <text x="28" y="27" fill="#74827f" font-family="monospace" font-size="11" letter-spacing="2">FIG. 01 / THE GIT LOOP</text>
  <g font-family="Arial, sans-serif">
    <rect x="28" y="87" width="173" height="128" rx="4" fill="#f7e3d1" stroke="#ef5b35" stroke-width="2"/>
    <rect x="229" y="87" width="173" height="128" rx="4" fill="#dbe9ed" stroke="#2c6386" stroke-width="2"/>
    <rect x="430" y="87" width="173" height="128" rx="4" fill="#d1e7dc" stroke="#2e795d" stroke-width="2"/>
    <rect x="631" y="87" width="241" height="128" rx="4" fill="#16282e" stroke="#36565a" stroke-width="2"/>
    <text x="45" y="116" fill="#c74124" font-size="11" font-weight="700" letter-spacing="1.5">01 / EDIT</text>
    <text x="45" y="143" fill="#12242c" font-size="19" font-weight="700">Working tree</text>
    <text x="45" y="168" fill="#647277" font-size="12">แก้ไฟล์ในโฟลเดอร์</text>
    <text x="45" y="192" fill="#ef5b35" font-family="monospace" font-size="12">your changes</text>
    <text x="246" y="116" fill="#2c6386" font-size="11" font-weight="700" letter-spacing="1.5">02 / SELECT</text>
    <text x="246" y="143" fill="#12242c" font-size="19" font-weight="700">Staging area</text>
    <text x="246" y="168" fill="#647277" font-size="12">เลือกสิ่งที่จะบันทึก</text>
    <text x="246" y="192" fill="#2c6386" font-family="monospace" font-size="12">git add</text>
    <text x="447" y="116" fill="#2e795d" font-size="11" font-weight="700" letter-spacing="1.5">03 / SAVE</text>
    <text x="447" y="143" fill="#12242c" font-size="19" font-weight="700">Local repo</text>
    <text x="447" y="168" fill="#647277" font-size="12">ประวัติในเครื่อง</text>
    <text x="447" y="192" fill="#2e795d" font-family="monospace" font-size="12">git commit</text>
    <text x="648" y="116" fill="#f3bd72" font-size="11" font-weight="700" letter-spacing="1.5">04 / SHARE</text>
    <text x="648" y="143" fill="#f0f6f3" font-size="19" font-weight="700">Remote repo</text>
    <text x="648" y="168" fill="#a4b8b4" font-size="12">สำรองและแชร์กับทีม</text>
    <text x="648" y="192" fill="#83c4ca" font-family="monospace" font-size="12">git push</text>
    <path d="M207 151H222" stroke="#ef5b35" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M408 151H423" stroke="#ef5b35" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M609 151H624" stroke="#ef5b35" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M752 227C752 263 112 263 112 225" fill="none" stroke="#ef5b35" stroke-width="1.6" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
    <text x="350" y="283" fill="#ef5b35" font-size="11" font-weight="700">แก้รอบใหม่ → status → add → commit</text>
  </g>
</svg>
